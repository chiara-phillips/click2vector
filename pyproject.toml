[project]
name = "click2vector"
version = "0.11.5"
description = "Click 2 Vector: interactive map for creating and exporting vector points"
readme = "README.md"
requires-python = ">=3.11,<4.0"
authors = [{ name = "Chiara Phillips" }]
dependencies = [
    "streamlit>=1.47.0",
    "folium>=0.20.0",
    "streamlit-folium>=0.27.2",
    "pandas>=2.3.1",
    "geopandas>=0.13.2",
    "pyogrio>=0.7.0",
]

[dependency-groups]
dev = [
    "pre-commit>=3.6.2",
    "pytest>=8.3.0",
    "radon>=6.0.1",
    "ruff>=0.11.0",
    "vulture>=2.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E203"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
